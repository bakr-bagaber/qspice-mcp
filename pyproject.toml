[project]
name = "qspice-mcp"
version = "0.2.0"
description = "MCP server for the QSPICE circuit simulator: simulation, waveforms, and LLM-friendly schematic drawing with review, symbols and skills"
readme = "README.md"
authors = [
    { name = "bagaber", email = "mail@bakrbagaber.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
qspice-mcp = "qspice_mcp:main"
qmcp = "qspice_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
